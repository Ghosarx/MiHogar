<header class="navbar">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__brand" aria-label="MiHogar - Ir al inicio" (click)="closeMenu()">
      <span class="logo-MiHogar">
        <svg class="logo-MiHogar__icon" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 9.5L12 3L21 9.5V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V9.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 21V12H15V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-MiHogar__text">MiHogar</span>
      </span>
    </a>

    <button type="button" class="navbar__toggle" [class.is-open]="menuOpen()" [attr.aria-expanded]="menuOpen()" aria-controls="navbar-menu" [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'" (click)="toggleMenu()">
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
      <span class="navbar__toggle-bar"></span>
    </button>

    <nav id="navbar-menu" class="navbar__menu" [class.is-open]="menuOpen()" aria-label="Navegación principal">
      <a routerLink="/comprar"  routerLinkActive="is-active" class="navbar__link" (click)="closeMenu()">Comprar</a>
      <a routerLink="/alquilar" routerLinkActive="is-active" class="navbar__link" (click)="closeMenu()">Alquilar</a>
      <a routerLink="/publicar" routerLinkActive="is-active" class="navbar__link" (click)="closeMenu()">Publicar Propiedad</a>

      @if (authService.isAuthenticated()) {
        <span class="navbar__link">Hola, {{ authService.user()?.nombre }}</span>
        <button type="button" class="navbar__link navbar__link--ghost" (click)="logout()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login"   routerLinkActive="is-active" class="navbar__link navbar__link--ghost" (click)="closeMenu()">Iniciar sesión</a>
        <a routerLink="/registro" routerLinkActive="is-active" class="navbar__link navbar__link--cta"   (click)="closeMenu()">Registrarse</a>
      }
    </nav>
  </div>
</header>
